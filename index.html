<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>影像 · Video</title>
<style>
  :root{
    --card:rgba(255,255,255,.05);
    --stroke:rgba(255,255,255,.13);
    --text:#f5f7fb;
    --muted:rgba(245,247,251,.6);
    --accent:#7c8cff;
    --accent2:#43e5c0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:#000;color:var(--text);
    min-height:100vh;overflow-x:hidden;
  }

  /* 纯黑背景 + 粒子 */
  #particles{position:fixed;inset:0;z-index:0;pointer-events:none}

  main{position:relative;z-index:2;width:min(1120px,100%);margin:0 auto;padding:56px 22px 80px}

  /* 顶部封面大图 */
  .hero{
    position:relative;border-radius:22px;overflow:hidden;margin-bottom:40px;
    height:clamp(230px,40vw,430px);
    border:1px solid var(--stroke);
    box-shadow:0 34px 80px -28px rgba(0,0,0,.95), 0 0 0 1px rgba(124,140,255,.12);
    animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
  }
  .hero img{width:100%;height:100%;object-fit:cover;display:block;
            transform:scale(1.03);transition:transform 9s ease}
  .hero:hover img{transform:scale(1.1)}
  .hero::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.1) 20%,rgba(0,0,0,.55) 65%,rgba(0,0,0,.92));}
  .hero-text{position:absolute;left:0;bottom:0;z-index:2;padding:clamp(20px,3.4vw,42px)}
  h1{font-size:clamp(30px,5.4vw,58px);font-weight:800;letter-spacing:3px;line-height:1;
     background:linear-gradient(120deg,#fff,#b7c0ff 45%,#7ff0da);
     -webkit-background-clip:text;background-clip:text;color:transparent;
     text-shadow:0 6px 30px rgba(0,0,0,.4)}
  .sub{color:var(--muted);font-size:12.5px;letter-spacing:4px;text-transform:uppercase;margin-top:10px}

  /* 视频网格 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:18px}
  .card{
    position:relative;border-radius:16px;overflow:hidden;cursor:pointer;
    background:var(--card);border:1px solid var(--stroke);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s,border-color .28s;
    animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  .card:hover{transform:translateY(-5px);border-color:rgba(124,140,255,.55);
              box-shadow:0 24px 50px -18px rgba(0,0,0,.9),0 0 0 1px rgba(124,140,255,.2)}
  .thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#0a0b12}
  .card .overlay{position:absolute;inset:0;pointer-events:none;
                 background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.32))}
  .card .badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);
    width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(8,10,18,.5);border:1px solid rgba(255,255,255,.4);
    backdrop-filter:blur(6px);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
  .card:hover .badge{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .card .badge svg{width:22px;height:22px;fill:#fff;margin-left:3px}
  /* 弹窗播放器 */
  .modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
         padding:24px;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .modal.open{display:flex;animation:fade .25s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal-inner{position:relative;width:80vw;height:80vh;height:80dvh;animation:pop .35s cubic-bezier(.2,.8,.2,1) both}
  @keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
  .player{position:relative;width:100%;height:100%;border-radius:18px;overflow:hidden;background:#000;line-height:0;
          box-shadow:0 30px 80px -20px rgba(0,0,0,.95)}
  .player video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
  .player:fullscreen{width:100vw;height:100vh;height:100dvh;border-radius:0}
  .video-nav{position:absolute;top:50%;z-index:5;transform:translateY(-50%);
    width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.25);background:rgba(20,22,30,.65);color:#fff;cursor:pointer;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .2s,border-color .2s}
  .video-nav:hover{background:rgba(124,140,255,.35);border-color:rgba(255,255,255,.6)}
  .video-nav:focus-visible{outline:2px solid var(--accent2);outline-offset:3px}
  .video-nav svg{width:20px;height:20px;fill:currentColor}
  .video-prev{left:18px}
  .video-next{right:18px}
  .close{position:absolute;top:-14px;right:-14px;z-index:5;width:40px;height:40px;border-radius:50%;
         border:1px solid rgba(255,255,255,.25);background:rgba(20,22,30,.92);color:#fff;font-size:20px;
         cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s,background .2s}
  .close:hover{transform:rotate(90deg);background:rgba(40,44,60,.95)}

  .controls{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:center;gap:12px;
            padding:22px 16px 14px;
            background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,.25) 55%,transparent);
            opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
  .player:hover .controls,.player.show-controls .controls{opacity:1;transform:none}
  .ctrl{border:0;background:transparent;color:#fff;cursor:pointer;padding:6px;border-radius:10px;
        display:flex;align-items:center;justify-content:center;transition:background .2s,transform .15s}
  .ctrl:hover{background:rgba(255,255,255,.14)}
  .ctrl:active{transform:scale(.92)}
  .ctrl svg{width:20px;height:20px;display:block}
  .bar{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.2);cursor:pointer;position:relative;min-width:60px}
  .bar:hover{height:8px}
  .progress{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;
            background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .progress::after{content:"";position:absolute;right:-5px;top:50%;width:12px;height:12px;border-radius:50%;
            background:#fff;transform:translateY(-50%) scale(0);transition:transform .2s;
            box-shadow:0 0 10px rgba(255,255,255,.8)}
  .bar:hover .progress::after{transform:translateY(-50%) scale(1)}
  .time{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .big-play{position:absolute;inset:0;z-index:3;border:0;cursor:pointer;color:#fff;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at center,rgba(0,0,0,.35),transparent 68%);transition:opacity .35s}
  .big-play svg{width:74px;height:74px;filter:drop-shadow(0 10px 28px rgba(0,0,0,.65));transition:transform .25s}
  .big-play:hover svg{transform:scale(1.08)}
  .big-play.hidden{opacity:0;pointer-events:none}

  /* 上传按钮 + 提示 */
  .upload-fab{position:fixed;right:24px;bottom:24px;z-index:50;display:flex;align-items:center;gap:8px;
    padding:14px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.18);
    background:linear-gradient(120deg,var(--accent),var(--accent2));color:#06121a;font-weight:700;font-size:14px;
    cursor:pointer;box-shadow:0 18px 40px -12px rgba(0,0,0,.85);transition:transform .2s,opacity .2s}
  .upload-fab:hover{transform:translateY(-2px)}
  .upload-fab:disabled{opacity:.6;cursor:default;transform:none}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);z-index:70;
    max-width:80vw;padding:12px 18px;border-radius:12px;background:rgba(20,22,30,.95);border:1px solid var(--stroke);
    color:var(--text);font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:560px){ main{padding:40px 16px 60px} }
</style>
</head>
<body>
  <canvas id="particles"></canvas>

  <main>
    <!-- 顶部封面：assets/img/background photo.jpg -->
    <section class="hero">
      <img src="assets/img/background photo.jpg" alt="cover" />
      <div class="hero-text">
        <h1>影像</h1>
        <p class="sub">A moment in motion</p>
      </div>
    </section>

    <div class="grid" id="grid"></div>
  </main>

  <button id="uploadBtn" class="upload-fab" type="button">＋ 上传</button>
  <input type="file" id="fileInput" accept="image/*,video/*" multiple hidden>
  <div class="toast" id="toast"></div>

  <div class="modal" id="modal">
    <div class="modal-inner">
      <button class="close" id="close" aria-label="关闭">&times;</button>
      <div class="player" id="player">
        <video id="v" playsinline preload="metadata"></video>
        <button class="video-nav video-prev" id="prevBtn" type="button" aria-label="上一个视频">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5v14L5 12z"/></svg>
        </button>
        <button class="video-nav video-next" id="nextBtn" type="button" aria-label="下一个视频">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="big-play" id="bigPlay" aria-label="播放">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="controls">
          <button class="ctrl" id="playBtn" aria-label="播放/暂停"></button>
          <div class="bar" id="bar"><div class="progress" id="prog"></div></div>
          <span class="time" id="time">0:00 / 0:00</span>
          <button class="ctrl" id="muteBtn" aria-label="静音"></button>
          <button class="ctrl" id="fsBtn" aria-label="全屏"></button>
        </div>
      </div>
    </div>
  </div>

<script src="assets/js/config.js"></script>
<script>
/* ============================================================
   配置统一在 assets/js/config.js 里改（Worker 地址 + 上传口令）
   ============================================================ */
const ALBUM_CONFIG = window.ALBUM_CONFIG || {};
const WORKER_URL = ALBUM_CONFIG.workerUrl || "https://proud-flower-5f26.hleisure161.workers.dev";
const UPLOAD_PASSWORD = ALBUM_CONFIG.uploadPassword || "";
/* ============================================================ */

const grid = document.getElementById('grid');
const PLAY_SVG = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';

let items = [];        // 全部媒体 { name, url, type }
let videoItems = [];   // 仅视频
const isVideoName = n => /\.(mp4|mov|webm)$/i.test(n);

/* ---------------- 拉取列表并渲染 ---------------- */
async function loadGallery(){
  grid.innerHTML = '<p style="color:var(--muted);padding:20px">加载中…</p>';
  try{
    const res = await fetch(WORKER_URL + '/list');
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || '加载失败');
    items = data.files.map(f => ({ name:f.name, url:f.url, type:isVideoName(f.name) ? 'video' : 'image' }));
    videoItems = items.filter(x => x.type === 'video');
    renderGrid();
  }catch(e){
    grid.innerHTML = '<p style="color:var(--muted);padding:20px">加载失败：' + e.message + '</p>';
  }
}

function renderGrid(){
  grid.innerHTML = '';
  if(!items.length){
    grid.innerHTML = '<p style="color:var(--muted);padding:20px">还没有内容，点右下角「上传」吧。</p>';
    return;
  }
  items.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = (i * 50) + 'ms';
    if(item.type === 'video'){
      card.innerHTML = `<video class="thumb" src="${item.url}#t=0.4" preload="metadata" muted playsinline></video>
        <div class="overlay"></div>
        <div class="badge">${PLAY_SVG}</div>`;
      card.addEventListener('click', () => openVideo(videoItems.indexOf(item)));
    }else{
      card.innerHTML = `<img class="thumb" src="${item.url}" loading="lazy" alt="">`;
      card.addEventListener('click', () => window.open(item.url, '_blank'));
    }
    grid.appendChild(card);
  });
}

/* ---------------- 弹窗播放器 ---------------- */
const modal = document.getElementById('modal');
const v = document.getElementById('v');
const player = document.getElementById('player');
const bigPlay = document.getElementById('bigPlay');
const playBtn = document.getElementById('playBtn');
const bar = document.getElementById('bar');
const prog = document.getElementById('prog');
const time = document.getElementById('time');
const muteBtn = document.getElementById('muteBtn');
const fsBtn = document.getElementById('fsBtn');
let currentVideoIndex = -1;

const ICON = {
  play : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  vol  : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>',
  mute : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zm3.9 2 2.1-2.1-1.4-1.4-2.1 2.1-2.1-2.1-1.4 1.4 2.1 2.1-2.1 2.1 1.4 1.4 2.1-2.1 2.1 2.1 1.4-1.4z"/></svg>',
  full : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9V4h5v2H6v3H4zm11-5h5v5h-2V6h-3V4zM6 15v3h3v2H4v-5h2zm12 0h2v5h-5v-2h3v-3z"/></svg>'
};

function fmt(s){
  if (!isFinite(s)) s = 0;
  s = Math.max(0, Math.floor(s));
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}

function openVideo(index){
  if (!videoItems.length) return;
  currentVideoIndex = (index + videoItems.length) % videoItems.length;
  v.pause();
  prog.style.width = '0%';
  time.textContent = '0:00 / 0:00';
  bigPlay.classList.remove('hidden');
  playBtn.innerHTML = ICON.play;
  v.src = videoItems[currentVideoIndex].url;
  v.load();
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
  v.play().catch(()=>{});
}
function switchVideo(direction){
  if (currentVideoIndex < 0 || !modal.classList.contains('open')) return;
  openVideo(currentVideoIndex + direction);
}
document.getElementById('prevBtn').addEventListener('click', () => switchVideo(-1));
document.getElementById('nextBtn').addEventListener('click', () => switchVideo(1));
function closeVideo(){
  v.pause();
  v.removeAttribute('src');
  v.load();
  modal.classList.remove('open');
  currentVideoIndex = -1;
  document.body.style.overflow = '';
}
document.getElementById('close').addEventListener('click', closeVideo);
modal.addEventListener('click', e => { if (e.target === modal) closeVideo(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('open')) closeVideo(); });

function toggle(){ v.paused ? v.play() : v.pause(); }
bigPlay.addEventListener('click', toggle);
playBtn.addEventListener('click', toggle);

v.addEventListener('play',  () => { bigPlay.classList.add('hidden'); playBtn.innerHTML = ICON.pause; });
v.addEventListener('pause', () => { bigPlay.classList.remove('hidden'); playBtn.innerHTML = ICON.play; });
v.addEventListener('ended', () => { bigPlay.classList.remove('hidden'); });
v.addEventListener('loadedmetadata', () => { time.textContent = '0:00 / ' + fmt(v.duration); });
v.addEventListener('timeupdate', () => {
  prog.style.width = (v.duration ? (v.currentTime / v.duration) * 100 : 0) + '%';
  time.textContent = fmt(v.currentTime) + ' / ' + fmt(v.duration);
});
bar.addEventListener('click', e => {
  const r = bar.getBoundingClientRect();
  const ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  if (v.duration) v.currentTime = ratio * v.duration;
});
muteBtn.addEventListener('click', () => { v.muted = !v.muted; muteBtn.innerHTML = v.muted ? ICON.mute : ICON.vol; });
fsBtn.addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else player.requestFullscreen && player.requestFullscreen();
});
document.addEventListener('keydown', e => {
  if (e.target.closest('button')) return;
  if (e.code === 'Space' && modal.classList.contains('open')) { e.preventDefault(); toggle(); }
});
playBtn.innerHTML = ICON.play;
muteBtn.innerHTML = ICON.vol;
fsBtn.innerHTML = ICON.full;

/* ---------------- 上传 ---------------- */
const uploadBtn = document.getElementById('uploadBtn');
const fileInput = document.getElementById('fileInput');
const toast = document.getElementById('toast');
let toastTimer;
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
}

// 压缩图片：最长边不超过 maxSize，输出 JPEG（视频不压缩）
async function compressImage(file, maxSize = 1600, quality = 0.82){
  const bitmap = await createImageBitmap(file);
  let { width, height } = bitmap;
  const scale = Math.min(1, maxSize / Math.max(width, height));
  width = Math.round(width * scale);
  height = Math.round(height * scale);
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  canvas.getContext('2d').drawImage(bitmap, 0, 0, width, height);
  const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', quality));
  const name = file.name.replace(/\.[^.]+$/, '') + '.jpg';
  return new File([blob], name, { type:'image/jpeg' });
}

// File -> 纯 Base64（去掉 data: 前缀）
function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function uploadOne(file){
  const out = file.type.startsWith('image/') ? await compressImage(file) : file;
  const content = await fileToBase64(out);
  const res = await fetch(WORKER_URL + '/upload', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: UPLOAD_PASSWORD, filename: out.name, content }),
  });
  return res.json();
}

uploadBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async () => {
  const files = Array.from(fileInput.files || []);
  if (!files.length) return;
  uploadBtn.disabled = true;

  let done = 0;
  for (const file of files){
    try{
      const r = await uploadOne(file);
      if (!r.ok) showToast('上传失败：' + r.error);
    }catch(e){
      showToast('上传出错：' + e.message);
    }
    done++;
    uploadBtn.textContent = `上传中 ${done}/${files.length}`;
  }

  fileInput.value = '';
  uploadBtn.disabled = false;
  uploadBtn.textContent = '＋ 上传';
  showToast('上传完成，正在刷新…');
  await loadGallery();
});

/* ============================================================
   粒子系统：纯黑背景 + 漂浮 + 鼠标靠近散开（鱼群）
   ============================================================ */
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

const mouse = { x: -9999, y: -9999, active: false };
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
window.addEventListener('mouseout',  () => { mouse.active = false; mouse.x = -9999; mouse.y = -9999; });
window.addEventListener('touchmove', e => { const t = e.touches[0]; mouse.x = t.clientX; mouse.y = t.clientY; mouse.active = true; }, { passive: true });
window.addEventListener('touchend',  () => { mouse.active = false; mouse.x = -9999; mouse.y = -9999; });

const COLORS = ['#98a5ff', '#55ffda', '#b0bcff', '#78ffe8', '#dbe3ff'];
let particles = [];

function initParticles(){
  const count = Math.round(Math.min(300, Math.max(120, (W * H) / 7500)));
  particles = [];
  for (let i = 0; i < count; i++){
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - .5) * 0.4,
      vy: (Math.random() - .5) * 0.4,
      r: Math.random() * 2.6 + 1.2,
      c: COLORS[(Math.random() * COLORS.length) | 0],
      a: Math.random() * 0.3 + 0.65
    });
  }
}

const R = 140;        // 鼠标影响半径
const LINK = 96;      // 连线距离
const MAX_SPEED = 5.5;

function frame(){
  ctx.clearRect(0, 0, W, H);

  for (const p of particles){
    if (mouse.active){
      const dx = p.x - mouse.x, dy = p.y - mouse.y;
      const d2 = dx*dx + dy*dy;
      if (d2 < R*R && d2 > 0.01){
        const d = Math.sqrt(d2);
        const force = (1 - d / R);
        p.vx += (dx / d) * force * 1.5;   // 远离鼠标
        p.vy += (dy / d) * force * 1.5;
      }
    }
    p.vx *= 0.965; p.vy *= 0.965;
    p.vx += (Math.random() - .5) * 0.03;
    p.vy += (Math.random() - .5) * 0.03;

    const sp = Math.hypot(p.vx, p.vy);
    if (sp > MAX_SPEED){ p.vx = p.vx / sp * MAX_SPEED; p.vy = p.vy / sp * MAX_SPEED; }

    p.x += p.vx; p.y += p.vy;

    if (p.x < -12) p.x = W + 12; else if (p.x > W + 12) p.x = -12;
    if (p.y < -12) p.y = H + 12; else if (p.y > H + 12) p.y = -12;
  }

  // 邻近连线（鱼群感）
  ctx.lineWidth = 1;
  for (let i = 0; i < particles.length; i++){
    const a = particles[i];
    for (let j = i + 1; j < particles.length; j++){
      const b = particles[j];
      const dx = a.x - b.x, dy = a.y - b.y;
      const d2 = dx*dx + dy*dy;
      if (d2 < LINK*LINK){
        const alpha = (1 - Math.sqrt(d2) / LINK) * 0.2;
        ctx.strokeStyle = 'rgba(172,190,255,' + alpha + ')';
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
  }

  // 粒子本体
  for (const p of particles){
    ctx.globalAlpha = p.a;
    ctx.fillStyle = p.c;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(frame);
}

resize();
initParticles();
frame();
window.addEventListener('resize', () => { resize(); initParticles(); });

/* ---------------- 首次进入加载列表 ---------------- */
loadGallery();
</script>
