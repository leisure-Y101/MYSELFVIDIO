<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f1ea" />
  <meta name="description" content="西南F4 · 我们共同保存的照片记忆。" />
  <title>西南F4 · 回忆相册</title>
  <link rel="stylesheet" href="assets/css/our.css" />
  <script>document.documentElement.classList.add("js");</script>
</head>
<body>
  <canvas id="particles" class="particle-canvas" aria-hidden="true"></canvas>
  <header class="site-header" id="siteHeader">
    <a class="wordmark" href="#cover" aria-label="返回封面">
      <span class="wordmark-mark">F4</span>
      <span class="wordmark-text">西南<span>MEMORY ARCHIVE</span></span>
    </a>
    <nav class="site-nav" aria-label="页面导航">
      <a href="#albums">相册</a>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题" title="切换主题">
        <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v2M12 19.5v2M4.4 4.4l1.4 1.4M18.2 18.2l1.4 1.4M2.5 12h2M19.5 12h2M4.4 19.6l1.4-1.4M18.2 5.8l1.4-1.4"/></svg>
        <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M19.4 15.6A7.7 7.7 0 0 1 8.4 4.6 8.3 8.3 0 1 0 19.4 15.6Z"/></svg>
      </button>
      <button class="header-upload" id="headerUpload" type="button">
        <span class="header-upload-plus" aria-hidden="true">+</span>
        <span>新增回忆</span>
      </button>
    </nav>
  </header>

  <main>
    <section class="cover" id="cover" aria-labelledby="coverTitle">
      <img class="cover-image" src="assets/img/cover.jpg" alt="湖边晚霞与树影" />
      <div class="cover-content">
        <p class="cover-kicker"><span></span> OUR MEMORY ARCHIVE <span></span></p>
        <h1 id="coverTitle"><span>西南</span><em>F4</em></h1>
        <p class="cover-note">把一起走过的路，留给以后再看。</p>
      </div>
      <a class="scroll-cue" href="#albums" aria-label="向下查看相册">
        <span>向下查看相册</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M6 9l6 6 6-6" />
        </svg>
      </a>
    </section>

    <section class="albums-section" id="albums" aria-labelledby="albumsTitle">
      <div class="section-intro" data-float>
        <div>
          <p class="eyebrow">MEMORY ALBUMS</p>
          <h2 id="albumsTitle">每个人，都有一页。</h2>
          <p class="section-copy">照片会按上传者和相册标题自动归档，打开一页，重温一段时间。</p>
        </div>
        <div class="sync-box" aria-live="polite">
          <span class="sync-dot" id="syncDot"></span>
          <span id="syncStatus">准备连接相册</span>
          <button class="refresh-button" id="refreshButton" type="button" aria-label="刷新相册" title="刷新相册">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path d="M20 11a8 8 0 0 0-14.9-4L3 9" />
              <path d="M3 4v5h5" />
              <path d="M4 13a8 8 0 0 0 14.9 4L21 15" />
              <path d="M21 20v-5h-5" />
            </svg>
          </button>
        </div>
      </div>

      <div class="album-grid" id="albumGrid" aria-live="polite"></div>

      <section class="album-detail" id="albumDetail" aria-labelledby="albumDetailTitle" hidden>
        <div class="detail-head">
          <button class="back-button" id="backToAlbums" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg>
            <span>全部相册</span>
          </button>
          <span class="detail-count" id="albumDetailCount"></span>
        </div>
        <div class="detail-title-row">
          <div>
            <p class="eyebrow" id="albumDetailOwner">MEMORY</p>
            <h2 id="albumDetailTitle">相册</h2>
          </div>
          <p class="detail-date" id="albumDetailDate"></p>
        </div>
        <div class="photo-grid" id="photoGrid" aria-live="polite"></div>
      </section>
    </section>
  </main>

  <footer class="site-footer" data-float>
    <span>西南 F4</span>
    <span>保存此刻，也保存我们。</span>
  </footer>

  <button class="floating-upload" id="floatingUpload" type="button" aria-label="新增相册" title="新增相册">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
  </button>

  <div class="modal" id="uploadModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="uploadTitle">
    <div class="modal-card">
      <div class="modal-heading">
        <div>
          <p class="eyebrow">ADD A MEMORY</p>
          <h2 id="uploadTitle">创建一页新相册</h2>
          <p>填写名字和相册标题，照片和视频会自动归档到你的相册。</p>
        </div>
        <button class="modal-close" id="closeUpload" type="button" aria-label="关闭上传窗口">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>

      <form id="uploadForm">
        <div class="form-row">
          <label class="form-field">
            <span>上传者 <b>*</b></span>
            <input id="uploaderName" name="uploader" type="text" maxlength="24" placeholder="比如：小周" autocomplete="name" required />
          </label>
          <label class="form-field">
            <span>相册标题 <b>*</b></span>
            <input id="albumTitle" name="album" type="text" maxlength="32" placeholder="比如：夏天的湖边" required />
          </label>
        </div>
        <label class="form-field password-field">
          <span>上传口令 <small>如果 Worker 未设置口令可留空</small></span>
          <input id="passwordInput" name="password" type="password" autocomplete="off" placeholder="输入共同口令" />
        </label>

        <input id="fileInput" type="file" accept="image/*,video/*" multiple hidden />
        <div class="drop-zone" id="dropZone" tabindex="0" role="button" aria-label="选择照片">
          <div class="drop-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3" /><circle cx="8.5" cy="9" r="1.5" /><path d="m5 17 4.5-4.5 3 3 2-2 4.5 4.5" /></svg>
          </div>
          <strong>点击选择照片或视频，或拖到这里</strong>
          <span>支持 JPG、PNG、WebP 以及 MP4、MOV 等；手机和电脑均可多选</span>
        </div>
        <div class="file-summary" id="fileSummary">还没有选择文件</div>

        <div class="modal-actions">
          <button class="quiet-button" id="cancelUpload" type="button">取消</button>
          <button class="solid-button" id="startUpload" type="submit" disabled>
            <span>开始上传</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" /></svg>
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="照片预览">
    <button class="lightbox-close" id="lightboxClose" type="button" aria-label="关闭照片预览">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
    </button>
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev" type="button" aria-label="上一张">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg>
    </button>
    <figure class="lightbox-figure">
      <img id="lightboxImage" alt="照片预览" />
      <figcaption id="lightboxCaption"></figcaption>
    </figure>
    <button class="lightbox-nav lightbox-next" id="lightboxNext" type="button" aria-label="下一张">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M9 18l6-6-6-6" /></svg>
    </button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/local-media.js" defer></script>
  <script src="assets/js/our.js" defer></script>
</body>
</html>
